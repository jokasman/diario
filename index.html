<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d5a80" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Diário</title>
    <script type="module" crossorigin src="./assets/index-BSa3vEcI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Bwg_rGwI.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <style>
      #jimport{position:fixed;left:50%;transform:translateX(-50%);
        bottom:calc(14px + env(safe-area-inset-bottom));z-index:2147483000;
        display:none;align-items:center;gap:6px;background:#3d5a80;color:#fff;
        padding:9px 8px 9px 14px;border-radius:999px;
        font:600 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        box-shadow:0 6px 18px rgba(0,0,0,.35)}
      #jimport a{color:#fff;text-decoration:none}
      #jimport .x{opacity:.85;font-weight:700;cursor:pointer;padding:0 8px;font-size:17px;line-height:1}
      .entry-card{position:relative}
      .z7-badges{position:absolute;top:8px;right:10px;display:flex;gap:4px;align-items:center}
      .z7-src,.z7-sync{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:999px;font:700 11px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
      a.btn{text-decoration:none}
      .z7-J{background:#6a5acd}.z7-W{background:#1f9d4d}
      .z7-sync.ok{background:#2e8b57}.z7-sync.pend{background:#d98e04}
      .entry-card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
      .entry-card-img{pointer-events:none}
      .entry-card.z7-selmode{padding-left:46px}
      .entry-card.z7-sel{outline:3px solid #3d5a80;outline-offset:-3px;background-color:rgba(61,90,128,.12)}
      .z7-pick{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;border:2px solid #3d5a80;background:rgba(255,255,255,.9);color:#fff;font:700 14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
      .z7-pick.on{background:#3d5a80}
      .z7-bar{position:fixed;top:0;left:0;right:0;z-index:2147483001;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#3d5a80;color:#fff;font:600 15px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35)}
      .z7-bar button{border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer;color:#fff;background:rgba(255,255,255,.18)}
      .z7-bar .z7-bx{padding:8px 11px;font-size:16px}
      .z7-bar .z7-del{background:#c0392b}
      .z7-bar button:disabled{opacity:.5;cursor:not-allowed}
    </style>
    <div id="jimport">
      <a href="./import.html">↧&nbsp;Importar do Journey</a>
      <span class="x" id="jimportx" title="Esconder" role="button" aria-label="Esconder">×</span>
    </div>
    <script>
      (function(){try{
        var K="diario.hideImport", box=document.getElementById("jimport");
        if(localStorage.getItem(K)){ box.remove(); return; }
        box.style.display="flex";
        document.getElementById("jimportx").addEventListener("click",function(e){
          e.preventDefault(); e.stopPropagation();
          try{localStorage.setItem(K,"1");}catch(_){ } box.remove();
        });
      }catch(e){}})();
    </script>
  </body>
</html>
